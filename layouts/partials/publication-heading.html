<header class="publication wrap">
  <div class="publication-topline">
    <div class="publication-copy">
      <div class="publication-title-line">
        <span class="publication-logo" aria-hidden="true">N</span>
        <div>
          <h1>{{ .title }}</h1>
          <p class="publication-desc">{{ .description }}</p>
        </div>
      </div>
    </div>
    <div class="publication-actions" aria-label="页面操作">
      <a class="publication-action" href="{{ "index.xml" | relURL }}" aria-label="RSS 订阅">RSS</a>
      {{ partial "theme-toggle.html" . }}
    </div>
  </div>
</header>
