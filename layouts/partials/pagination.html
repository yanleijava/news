{{ if gt .TotalPages 1 }}
  {{ $currentPage := .PageNumber }}
  <nav class="site-pagination" aria-label="文章分页">
    {{ with .Prev }}<a class="pagination-step" href="{{ .URL }}" rel="prev">← 上一页</a>{{ end }}
    <div class="pagination-pages">
      {{ range .Pagers }}
        {{ if eq .PageNumber $currentPage }}<span class="pagination-current" aria-current="page">{{ .PageNumber }}</span>{{ else }}<a href="{{ .URL }}">{{ .PageNumber }}</a>{{ end }}
      {{ end }}
    </div>
    {{ with .Next }}<a class="pagination-step" href="{{ .URL }}" rel="next">下一页 →</a>{{ end }}
  </nav>
{{ end }}
